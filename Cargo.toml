[workspace]
resolver = "2"
members = [
    "crates/stockfly-types",
    "crates/stockfly-connectome",
    "crates/stockfly-sim",
    "crates/stockfly-chess",
    "crates/stockfly-train",
    "crates/stockfly-plasticity",
    "crates/stockfly-wasm",
    "crates/stockfly-server",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/LeonardSEO/stockfly"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
