[workspace]
resolver = "2"
members = [
    "crates/stockfly-types",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/LeonardSEO/stockfly"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
